<div class="social-icons flex justify-center space-x-6" {{ with .align }}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}"
        class="flex flex-col items-center hover:text-primary transition-colors">
        {{ partial "svg.html" . }}
        {{- if .text }}
        <span class="social-text mt-1 text-sm font-medium text-primary select-text">{{ .text }}</span>
        {{- end }}
    </a>
    {{- end }}
</div>
